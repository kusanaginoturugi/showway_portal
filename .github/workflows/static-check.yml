name: Static Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and public files
        run: |
          node --check public/assets/app.js
          node --check public/assets/sites.js
          test -f public/index.html
          test -f public/_headers
          test "$(find public -type f | wc -l)" -eq 7
